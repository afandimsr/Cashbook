server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Defense-in-depth: never expose the bot's internal service-to-service API
    # publicly. It's normally only reachable by the bot container over the
    # internal docker network (bypassing this proxy entirely), but this block
    # ensures a leaked BOT_INTERNAL_API_KEY still can't be used from outside.
    location ^~ /api/v1/internal/ {
        deny all;
        return 403;
    }

    location ^~ /api/ {
        proxy_pass http://go-cashbook-backend:8181;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
	#root /user/share/nginx/html;
	#index index.html index.htm;
	
        try_files $uri $uri/ /index.html;
    }
}
